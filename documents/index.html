```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Documents privés</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #111;
            color: #fff;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            border-radius: 16px;
            background: #1c1c1c;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .lock {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 26px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #111;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #82ff1f;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #82ff1f;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 18px;
            min-height: 22px;
            color: #ff7777;
        }

        .back {
            display: block;
            margin-top: 25px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #82ff1f;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="lock">🔒</div>

        <h1>Documents privés</h1>

        <div class="subtitle">
            Accès réservé
        </div>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Identifiant"
                autocomplete="username"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Mot de passe"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                CONNEXION
            </button>

        </form>

        <div id="message"></div>

        <a class="back" href="../">
            ← Retour au site
        </a>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("message").textContent =
                "Authentification en cours…";

            // L'authentification réelle sera ajoutée
            // avec le système de stockage privé.
        });
    </script>

</body>
</html>
